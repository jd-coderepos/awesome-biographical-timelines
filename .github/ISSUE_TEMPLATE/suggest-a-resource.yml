name: Suggest a resource
description: Suggest a paper, dataset, or tool to add to the list
title: "[Suggestion]: "
labels: ["suggestion"]
body:
  - type: input
    id: title
    attributes:
      label: Resource title
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Datasets & Benchmarks
        - Methods
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-sentence description
      description: In the format used by the list, e.g. "Extracts X from Y using Z."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does this belong in the list?
    validations:
      required: false
