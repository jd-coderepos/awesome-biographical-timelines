    <text x="560.0" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1f24">Factuality Becomes Central</text>
    <text x="560.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">FActScore turns biography generation</text>
    <text x="560.0" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">into the standard hallucination testbed</text>
    
