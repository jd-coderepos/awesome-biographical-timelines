<svg viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of research evolution in biographical timeline generation, 2015 to 2026">
  <rect x="1" y="1" width="1298" height="458" rx="20" fill="#ffffff" stroke="#e2e2e2" stroke-width="1.5"/>
  <text x="650.0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">How This Research Evolved</text>
  <text x="650.0" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6e7781">From rule-based Wikipedia extraction to LLM-prompted single-document timelines</text>
  <line x1="90" y1="270" x2="1210" y2="270" stroke="#d8dee4" stroke-width="3"/>
  <line x1="130" y1="210" x2="130" y2="246" stroke="#4A6FA5" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="130" cy="270" r="24" fill="#4A6FA5"/>
    
        <circle cx="122" cy="276" r="3" fill="white"/>
        <circle cx="138" cy="276" r="3" fill="white"/>
        <circle cx="130" cy="262" r="3" fill="white"/>
        <line x1="122" y1="276" x2="130" y2="262" stroke="white" stroke-width="1.6"/>
        <line x1="138" y1="276" x2="130" y2="262" stroke="white" stroke-width="1.6"/>
        <line x1="122" y1="276" x2="138" y2="276" stroke="white" stroke-width="1.6"/>
        
    
        <text x="130" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4A6FA5" letter-spacing="0.5">2015 - 2019</text>
        <text x="130" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Wikipedia &amp; Knowledge Graphs</text>
        <text x="130" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Rule-based pipelines pull events</text>
        <text x="130" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">from Wikipedia bios into RDF/KGs</text>
        
<line x1="390" y1="294" x2="390" y2="310" stroke="#3E9C8F" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="390" cy="270" r="24" fill="#3E9C8F"/>
    
        <rect x="381" y="261" width="18" height="18" rx="1.5" fill="none" stroke="white" stroke-width="1.6"/>
        <line x1="384.5" y1="266.5" x2="395.5" y2="266.5" stroke="white" stroke-width="1.4"/>
        <line x1="384.5" y1="270" x2="395.5" y2="270" stroke="white" stroke-width="1.4"/>
        <line x1="384.5" y1="273.5" x2="392" y2="273.5" stroke="white" stroke-width="1.4"/>
        
    
        <text x="390" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3E9C8F" letter-spacing="0.5">2020 - 2022</text>
        <text x="390" y="354" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Event Extraction &amp; News Timelines</text>
        <text x="390" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Dedicated corpora formalize event</text>
        <text x="390" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">extraction; multi-doc news TLS matures</text>
        
<line x1="650" y1="210" x2="650" y2="246" stroke="#E0972E" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="650" cy="270" r="24" fill="#E0972E"/>
    
        <path d="M 642,269 L 647.5,276 L 659,262" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        
    
        <text x="650" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E0972E" letter-spacing="0.5">2023</text>
        <text x="650" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Factuality Becomes Central</text>
        <text x="650" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">FActScore turns biography generation</text>
        <text x="650" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">into the standard hallucination testbed</text>
        
<line x1="910" y1="294" x2="910" y2="310" stroke="#7B5FE0" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="910" cy="270" r="24" fill="#7B5FE0"/>
    
        <path d="M 899,262 h22 a3,3 0 0 1 3,3 v8 a3,3 0 0 1 -3,3 h-14 l-6,5 v-5 h-2 a3,3 0 0 1 -3,-3 v-8 a3,3 0 0 1 3,-3 z"
              fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="906" cy="268.5" r="1.3" fill="white"/>
        <circle cx="910" cy="268.5" r="1.3" fill="white"/>
        <circle cx="914" cy="268.5" r="1.3" fill="white"/>
        
    
        <text x="910" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7B5FE0" letter-spacing="0.5">2024 - 2025</text>
        <text x="910" y="354" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">The LLM-Prompting Era</text>
        <text x="910" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Multi-stage pipelines give way to single</text>
        <text x="910" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">prompts — on news and single documents</text>
        
<line x1="1170" y1="210" x2="1170" y2="246" stroke="#4E9A4E" stroke-width="2" stroke-dasharray="2,3"/>
    <circle cx="1170" cy="270" r="24" fill="#4E9A4E"/>
    <path d="M 1170.0,261.0 L 1172.5,267.5 L 1179.0,270.0 L 1172.5,272.5 L 1170.0,279.0 L 1167.5,272.5 L 1161.0,270.0 L 1167.5,267.5 Z" fill="white"/>
    
        <text x="1170" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4E9A4E" letter-spacing="0.5">2026</text>
        <text x="1170" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">Hallucination-Aware Refinement</text>
        <text x="1170" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">Chain-of-thought techniques get applied</text>
        <text x="1170" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">directly to timeline generation</text>
        
</svg>