    <text x="950.0" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3D8B3D" letter-spacing="0.5">2026</text>
    <text x="950.0" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1f24">Hallucination-Aware Refinement</text>
    <text x="950.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">Chain-of-thought techniques get applied</text>
    <text x="950.0" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">directly to timeline generation</text>
    
