    <text x="755.0" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1f24">The LLM-Prompting Era</text>
    <text x="755.0" y="407" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">Multi-stage pipelines give way to single</text>
    <text x="755.0" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">prompts — on news and single documents</text>
    
