    <text x="170.0" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1f24">Wikipedia &amp; Knowledge Graphs</text>
    <text x="170.0" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">Rule-based pipelines pull events</text>
    <text x="170.0" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">from Wikipedia bios into RDF/KGs</text>
    
