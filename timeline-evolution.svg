<svg viewBox="0 0 1300 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of research evolution in biographical timeline generation, 2015 to 2026">
  <rect x="1" y="1" width="1298" height="478" rx="20" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/>
  <text x="650.0" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#1a1f24">How This Research Evolved</text>
  <text x="650.0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4b535b">From rule-based Wikipedia extraction to LLM-prompted single-document timelines</text>
  <line x1="90" y1="290" x2="1210" y2="290" stroke="#d0d7de" stroke-width="3.5"/>
  <line x1="130" y1="228" x2="130" y2="262" stroke="#3E5F94" stroke-width="2.2" stroke-dasharray="2,3.5"/>
    <circle cx="130" cy="290" r="28" fill="#3E5F94"/>
    
        <circle cx="121" cy="297" r="3.4" fill="white"/>
        <circle cx="139" cy="297" r="3.4" fill="white"/>
        <circle cx="130" cy="281" r="3.4" fill="white"/>
        <line x1="121" y1="297" x2="130" y2="281" stroke="white" stroke-width="1.9"/>
        <line x1="139" y1="297" x2="130" y2="281" stroke="white" stroke-width="1.9"/>
        <line x1="121" y1="297" x2="139" y2="297" stroke="white" stroke-width="1.9"/>
        
    
    <text x="130" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3E5F94" letter-spacing="0.5">2015 - 2019</text>
    <text x="130" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1f24">Wikipedia &amp; Knowledge Graphs</text>
    <text x="130" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">Rule-based pipelines pull events</text>
    <text x="130" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">from Wikipedia bios into RDF/KGs</text>
    
<line x1="390" y1="318" x2="390" y2="331" stroke="#2E8B7D" stroke-width="2.2" stroke-dasharray="2,3.5"/>
    <circle cx="390" cy="290" r="28" fill="#2E8B7D"/>
    
        <rect x="379.5" y="279.5" width="21" height="21" rx="1.8" fill="none" stroke="white" stroke-width="1.9"/>
        <line x1="383.5" y1="286" x2="396.5" y2="286" stroke="white" stroke-width="1.7"/>
        <line x1="383.5" y1="290" x2="396.5" y2="290" stroke="white" stroke-width="1.7"/>
        <line x1="383.5" y1="294" x2="392.5" y2="294" stroke="white" stroke-width="1.7"/>
        
    
    <text x="390" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E8B7D" letter-spacing="0.5">2020 - 2022</text>
    <text x="390" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1f24">Event Extraction &amp; News Timelines</text>
    <text x="390" y="407" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">Dedicated corpora formalize event</text>
    <text x="390" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">extraction; multi-doc news TLS matures</text>
    
<line x1="650" y1="228" x2="650" y2="262" stroke="#D3860F" stroke-width="2.2" stroke-dasharray="2,3.5"/>
    <circle cx="650" cy="290" r="28" fill="#D3860F"/>
    
        <path d="M 640.5,289 L 647,297.5 L 660.5,280.5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        
    
    <text x="650" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#D3860F" letter-spacing="0.5">2023</text>
    <text x="650" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1f24">Factuality Becomes Central</text>
    <text x="650" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">FActScore turns biography generation</text>
    <text x="650" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">into the standard hallucination testbed</text>
    
<line x1="910" y1="318" x2="910" y2="331" stroke="#6A4EDB" stroke-width="2.2" stroke-dasharray="2,3.5"/>
    <circle cx="910" cy="290" r="28" fill="#6A4EDB"/>
    
        <path d="M 897,280.5 h26 a3.5,3.5 0 0 1 3.5,3.5 v9.5 a3.5,3.5 0 0 1 -3.5,3.5 h-16.5 l-7,6 v-6 h-2.5 a3.5,3.5 0 0 1 -3.5,-3.5 v-9.5 a3.5,3.5 0 0 1 3.5,-3.5 z"
              fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="905" cy="288" r="1.5" fill="white"/>
        <circle cx="910" cy="288" r="1.5" fill="white"/>
        <circle cx="915" cy="288" r="1.5" fill="white"/>
        
    
    <text x="910" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6A4EDB" letter-spacing="0.5">2024 - 2025</text>
    <text x="910" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1f24">The LLM-Prompting Era</text>
    <text x="910" y="407" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">Multi-stage pipelines give way to single</text>
    <text x="910" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">prompts — on news and single documents</text>
    
<line x1="1170" y1="228" x2="1170" y2="262" stroke="#3D8B3D" stroke-width="2.2" stroke-dasharray="2,3.5"/>
    <circle cx="1170" cy="290" r="28" fill="#3D8B3D"/>
    <path d="M 1170.0,279.5 L 1172.8,287.2 L 1180.5,290.0 L 1172.8,292.8 L 1170.0,300.5 L 1167.2,292.8 L 1159.5,290.0 L 1167.2,287.2 Z" fill="white"/>
    
    <text x="1170" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3D8B3D" letter-spacing="0.5">2026</text>
    <text x="1170" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1f24">Hallucination-Aware Refinement</text>
    <text x="1170" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">Chain-of-thought techniques get applied</text>
    <text x="1170" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#3d444d">directly to timeline generation</text>
    
</svg>