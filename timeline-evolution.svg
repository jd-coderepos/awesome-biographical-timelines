  <text x="560.0" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b535b">From rule-based Wikipedia extraction to LLM-prompted single-document timelines</text>
  <line x1="155" y1="290" x2="965" y2="290" stroke="#d0d7de" stroke-width="3.5"/>
