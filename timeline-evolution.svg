    <text x="365.0" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2E8B7D" letter-spacing="0.5">2020 - 2022</text>
    <text x="365.0" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1f24">Event Extraction &amp; News Timelines</text>
    <text x="365.0" y="407" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">Dedicated corpora formalize event</text>
    <text x="365.0" y="426" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#3d444d">extraction; multi-doc news TLS matures</text>
    
<line x1="560.0" y1="228" x2="560.0" y2="262" stroke="#D3860F" stroke-width="2.2" stroke-dasharray="2,3.5"/>
